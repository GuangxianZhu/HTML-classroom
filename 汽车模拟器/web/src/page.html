<title>汽车模拟器</title>
<style>
:root {
  /* 版式：左边是三维的车，右边一列仪表和图，底下一条挡位和踏板；手机上从上到下排，踏板钉在最底下。
     颜色照老式仪表台：黑底、暖白字、橙红指针、琥珀色背光。只做深色这一套。 */
  --bg: #11151a; --panel: #1a2027; --panel2: #232b34; --line: #33404c;
  --ink: #ece7da; --dim: #94a0ac;
  --needle: #ff5a2e; --amber: #ffb23e;
  --ok: #5bd08c; --info: #62bdf0; --warn: #ffd15c; --bad: #ff6f61;
  --num: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--text); -webkit-text-size-adjust: 100%; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
header { display: flex; align-items: baseline; gap: 12px; padding: 9px 16px 8px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; font-weight: 650; letter-spacing: .04em; }
header .sub { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
#stageWrap { position: relative; min-width: 0; min-height: 0; background: radial-gradient(120% 90% at 50% 18%, #26313c 0%, #151b21 58%, #0e1216 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.float { position: absolute; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#modes { left: 12px; top: 12px; right: 150px; }
#extra { right: 12px; bottom: 12px; justify-content: flex-end; }
#slowWrap { right: 12px; top: 12px; font-size: 12px; color: var(--dim); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: rgba(17, 21, 26, .78); }
.seg button { border: 0; background: none; padding: 7px 11px; font-size: 13px; color: var(--dim); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #1b1408; font-weight: 650; }
.chipbtn { border: 1px solid var(--line); border-radius: 8px; background: rgba(17, 21, 26, .78); padding: 7px 11px; font-size: 13px; }
.chipbtn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
select { background: rgba(17, 21, 26, .78); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
#tip { left: 12px; bottom: 12px; right: 190px; max-width: 460px; padding: 8px 11px; border-radius: 8px; border-left: 3px solid var(--amber);
  background: rgba(17, 21, 26, .86); font-size: 13px; line-height: 1.45; pointer-events: none; display: block; }
#tip b { font-weight: 650; }
#tip[hidden] { display: none; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; }
#loading[hidden] { display: none; }

#side { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
#side h2 { font-size: 13px; font-weight: 650; color: var(--amber); letter-spacing: .06em; margin-bottom: 7px; }
#now { background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
#nowText { font-size: 13.5px; line-height: 1.55; min-height: 4.6em; }
#chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; min-height: 22px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.chip.on { border-color: var(--info); color: var(--info); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.chip.bad { border-color: var(--bad); color: var(--bad); }

.dials { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dials svg { width: 100%; max-width: 190px; height: auto; display: block; margin: 0 auto; }
.dial-face { fill: #0d1014; stroke: var(--line); }
.tick { stroke: var(--ink); stroke-linecap: round; }
.tick.minor { stroke: var(--dim); }
.dial-num { fill: var(--ink); font: 600 13px var(--num); text-anchor: middle; dominant-baseline: central; }
.dial-unit { fill: var(--dim); font: 10.5px var(--text); text-anchor: middle; }
.dial-big { fill: var(--ink); font: 600 26px var(--num); text-anchor: middle; font-variant-numeric: tabular-nums; }
.dial-red { stroke: var(--bad); fill: none; }
.needle { stroke: var(--needle); stroke-width: 3; stroke-linecap: round; }
.hub { fill: #2a323b; stroke: var(--line); }
.target { fill: var(--amber); }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tile { background: var(--panel2); border-radius: 8px; padding: 6px 8px 7px; min-width: 0; }
.tile .k { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font: 600 19px/1.15 var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .v small { font: 11px var(--text); color: var(--dim); margin-left: 2px; }
.tile .s { font-size: 11px; color: var(--dim); line-height: 1.35; }

.try { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.try button { text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); padding: 7px 9px; line-height: 1.35; }
.try button b { display: block; font-weight: 650; font-size: 13px; }
.try button span { font-size: 11.5px; color: var(--dim); }
.try button:hover { border-color: var(--amber); }

canvas.plot { width: 100%; display: block; border-radius: 8px; background: #0d1014; }
#pul { height: 150px; }
#vario { height: 230px; }
.pulrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; margin-bottom: 6px; }
.pulrow div { font-size: 11.5px; color: var(--dim); }
.pulrow div:last-child { text-align: right; }
.pulrow b { display: block; font: 600 17px var(--num); color: var(--ink); font-variant-numeric: tabular-nums; }
.pulrow .mid { text-align: center; }
.pulrow .mid b { font-size: 26px; color: var(--amber); line-height: 1.1; }
.note { font-size: 12px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
.key { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }

#ebar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: #0d1014; }
#ebar i { display: block; height: 100%; min-width: 0; transition: flex-grow .15s linear; }
#elegend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 7px; font-size: 12px; color: var(--dim); }
#elegend span.num { color: var(--ink); float: right; }
#etotal { font-size: 12px; color: var(--dim); margin-bottom: 5px; }
#etotal b { color: var(--ink); font: 600 14px var(--num); }

.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 12.5px; line-height: 1.55; }
.facts li { padding-left: 46px; position: relative; }
.tag { position: absolute; left: 0; top: 2px; font-size: 11px; line-height: 1.5; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
.tag.t1 { border-color: var(--ok); color: var(--ok); }
.tag.t2 { border-color: var(--info); color: var(--info); }
.tag.t3 { border-color: var(--warn); color: var(--warn); }
.spec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }

footer { border-top: 1px solid var(--line); background: var(--panel); padding: 9px 16px 11px; display: grid; gap: 8px 16px;
  grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.5fr) auto; align-items: center; }
#gears { display: inline-flex; gap: 4px; }
#gears button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font: 600 18px var(--num); color: var(--dim); }
#gears button[aria-pressed="true"] { background: var(--ink); color: #14181d; border-color: var(--ink); }
.pedal { display: grid; grid-template-columns: auto minmax(0, 1fr) 46px; align-items: center; gap: 9px; }
.pedal label { font-size: 13px; font-weight: 650; }
.pedal output { font: 600 16px var(--num); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: none; margin: 0; --p: 0%; --c: var(--amber); }
input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--c) var(--p), #0d1014 var(--p)); border: 1px solid var(--line); }
input[type=range]::-moz-range-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--c) var(--p), #0d1014 var(--p)); border: 1px solid var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); border: 3px solid var(--c); margin-top: -9px; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 3px solid var(--c); }
#brk { --c: var(--bad); }
.misc { display: flex; gap: 6px; align-items: center; }
.keys { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); margin-top: -3px; }

@media (max-width: 900px) {
  body { font-size: 13.5px; }
  header { padding: 7px 12px 6px; }
  main { display: flex; flex-direction: column; }
  #stageWrap { flex: 0 0 39%; }
  #side { border-left: 0; border-top: 1px solid var(--line); padding: 10px 12px 16px; flex: 1 1 0; }
  #modes { left: 8px; top: 8px; right: 8px; }
  #slowWrap { top: auto; bottom: 8px; left: 8px; right: auto; }
  #slowWrap .lab { display: none; }
  #extra { right: 8px; bottom: 8px; }
  #tip { left: 8px; right: 8px; bottom: 48px; }
  .seg button, .chipbtn { padding: 6px 9px; font-size: 12.5px; }
  footer { grid-template-columns: auto minmax(0, 1fr); padding: 7px 12px 9px; gap: 4px 10px; }
  #gears { grid-row: 1; grid-column: 1; }
  .misc { grid-row: 1; grid-column: 2; justify-content: flex-end; }
  .pedal { grid-column: 1 / -1; }
  .dials svg { max-width: 160px; }
  .keys { display: none; }
  #gears button { width: 38px; height: 36px; }
  #nowText { min-height: 5.8em; }
  #vario { height: 200px; }
}
@media (max-width: 420px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  header .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { #ebar i { transition: none; } }
</style>

<div id="app">
  <header>
    <h1>汽车模拟器</h1>
    <span class="sub" id="sub"></span>
  </header>
  <main>
    <section id="stageWrap" aria-label="三维模型">
      <canvas id="gl"></canvas>
      <div class="float" id="modes">
        <div class="seg" role="group" aria-label="看什么">
          <button data-mode="car" aria-pressed="false">整车</button>
          <button data-mode="xray" aria-pressed="true">透视</button>
          <button data-mode="pt" aria-pressed="false">动力总成</button>
          <button data-mode="inside" aria-pressed="false">内部</button>
          <button data-mode="drive" aria-pressed="false">驾驶位</button>
        </div>
      </div>
      <div class="float" id="slowWrap">
        <label for="slow" class="lab">零件动作</label>
        <select id="slow" aria-label="零件动作放慢多少">
          <option value="1">真实速度</option>
          <option value="5">放慢 5 倍</option>
          <option value="20" selected>放慢 20 倍</option>
          <option value="100">放慢 100 倍</option>
        </select>
      </div>
      <div class="float" id="extra">
        <button class="chipbtn" id="hood" aria-pressed="false" hidden>开前盖</button>
        <button class="chipbtn" id="camEng" hidden>看发动机</button>
        <button class="chipbtn" id="camCvt" hidden>看 CVT</button>
        <button class="chipbtn" id="camAhead" hidden>看前方</button>
        <button class="chipbtn" id="camGauge" hidden>看仪表</button>
        <button class="chipbtn" id="camFeet" hidden>看脚下</button>
      </div>
      <div class="float" id="tip" hidden></div>
      <div id="loading">正在把车搬进来…</div>
    </section>

    <aside id="side">
      <div id="now" aria-live="off">
        <div id="chips"></div>
        <p id="nowText"></p>
      </div>

      <div class="dials">
        <svg id="tach" viewBox="0 0 200 200" role="img" aria-label="转速表"></svg>
        <svg id="speedo" viewBox="0 0 200 200" role="img" aria-label="车速表"></svg>
      </div>

      <div class="tiles" id="tiles"></div>

      <section>
        <h2>试试看</h2>
        <div class="try" id="try"></div>
      </section>

      <section>
        <h2>钢带和两个锥轮</h2>
        <div class="pulrow">
          <div><b class="num" id="pr1"></b>主动轮上钢带的半径 mm</div>
          <div class="mid"><b class="num" id="pratio"></b>速比</div>
          <div><b class="num" id="pr2"></b>从动轮上钢带的半径 mm</div>
        </div>
        <canvas class="plot" id="pul"></canvas>
        <p class="note" id="pulNote"></p>
      </section>

      <section>
        <h2>转速和车速</h2>
        <canvas class="plot" id="vario"></canvas>
        <p class="note" id="varioNote"></p>
      </section>

      <section>
        <h2>油烧出来的功率去哪了</h2>
        <div id="etotal"></div>
        <div id="ebar"></div>
        <div id="elegend"></div>
      </section>

      <section>
        <h2>这台车和这个模型</h2>
        <div class="spec" id="spec"></div>
        <ul class="facts" id="facts"></ul>
      </section>
    </aside>
  </main>

  <footer>
    <div id="gears" role="group" aria-label="挡位">
      <button data-gear="P" aria-pressed="true">P</button>
      <button data-gear="R" aria-pressed="false">R</button>
      <button data-gear="N" aria-pressed="false">N</button>
      <button data-gear="D" aria-pressed="false">D</button>
    </div>
    <div class="pedal">
      <label for="brk">刹车</label>
      <input type="range" id="brk" min="0" max="100" step="1" value="0">
      <output id="brkOut" for="brk" class="num">0%</output>
    </div>
    <div class="pedal">
      <label for="thr">油门</label>
      <input type="range" id="thr" min="0" max="100" step="1" value="0">
      <output id="thrOut" for="thr" class="num">0%</output>
    </div>
    <div class="misc">
      <select id="grade" aria-label="路面坡度">
        <option value="0">平路</option>
        <option value="0.05">上坡 5%</option>
        <option value="0.1">上坡 10%</option>
        <option value="-0.05">下坡 5%</option>
      </select>
      <button class="chipbtn" id="reset">复位</button>
    </div>
    <div class="keys">键盘：按住 ↑ 或 W 踩油门，按住空格或 ↓ 踩刹车，P / R / N / D 换挡。拖动画面转视角（驾驶位里是转头），点零件看名字和它现在的转速。</div>
  </footer>
</div>
