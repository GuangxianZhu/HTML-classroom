<title>车钻铣三合一机床：电子挂轮原理</title>
<style>
/* 和仓库里其他页面同一套深色工程风。左边三维舞台，右边讲义；手机竖屏时上下排。
   颜色约定：蓝=选中/强调，琥珀=编码器脉冲，绿=步进脉冲，红=警告。 */
:root{
  --bg:#08111f; --bg2:#13284a; --panel:#0c1729; --panel2:#0f1d34;
  --fg:#e8eef7; --muted:#93a4bb; --line:#24364f; --accent:#4cc3ff;
  --enc:#ffb547; --step:#58e0a0; --warn:#ff7066; --good:#4fd18b; --vio:#c78bff;
  --f-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-cn);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,32vw,480px);grid-template-rows:minmax(0,1fr) auto}
#stage{grid-column:1;grid-row:1;position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(100% 85% at 46% 40%,var(--bg2),var(--bg) 78%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(11,21,39,.86);border-radius:4px;padding:2px 6px;font-size:12px;white-space:nowrap}
.tag:hover,.tag.sel{border-color:var(--accent);color:var(--accent)}
.title{position:absolute;top:10px;left:12px;background:rgba(11,21,39,.84);border:1px solid var(--line);border-radius:5px;padding:6px 10px;max-width:calc(100% - 24px)}
.title h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.03em}
.title div{font-size:11.5px;color:var(--muted);margin-top:2px}
.hud{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.hud .chip{font:12px var(--f-mono);background:rgba(11,21,39,.84);border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--muted)}
.hud .chip b{color:var(--fg);font-weight:500}
.views{position:absolute;left:12px;bottom:10px;display:flex;gap:5px;flex-wrap:wrap}
.views button{font-size:12px;padding:5px 8px;border:1px solid var(--line);background:rgba(11,21,39,.84);border-radius:4px;cursor:pointer}
.views button:hover{border-color:var(--accent)}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.loading div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:13px}

#side>*{flex-shrink:0}
#side{grid-column:2;grid-row:1;min-height:0;overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px 26px;display:flex;flex-direction:column;gap:13px;scrollbar-color:var(--line) transparent}
.chno{font:600 12.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--accent)}
#side h2{margin:4px 0 2px;font-size:20px;line-height:1.3}
.lead{margin:0;font-size:14.5px;line-height:1.75}
.lead b{color:#fff}
.box{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.65}
.box h3{margin:0;font-size:14px;color:var(--accent);font-weight:600}
.ctl{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) 6.2em;align-items:center;gap:4px 8px;font-size:12.5px;color:var(--muted)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl output{font:12px var(--f-mono);color:var(--fg);text-align:right;white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;padding:7px 10px;border:1px solid var(--line);background:#12223d;border-radius:5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{border-color:var(--accent);background:#103552;color:#bfe8ff}
.readout{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.readout span:nth-child(2n){font-family:var(--f-mono);text-align:right}
.formula{font:13px/1.6 var(--f-mono);background:#091426;border:1px solid var(--line);border-radius:5px;padding:8px 10px;white-space:pre-wrap;overflow-x:auto}
.warn{color:var(--warn)} .good{color:var(--good)} .enc{color:var(--enc)} .stp{color:var(--step)} .mut{color:var(--muted)}
.basis{font-size:12.5px;line-height:1.7;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.basis b{color:var(--fg);font-weight:500}
.ev{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;margin-right:4px;border:1px solid}
.ev.k{color:#9fe3b9;border-color:#2f6b47}.ev.s{color:#9ccfff;border-color:#2b5378}.ev.g{color:#ffd28a;border-color:#7a5a24}.ev.a{color:#e0b8ff;border-color:#5d3b7a}
canvas.plot{width:100%;height:auto;display:block;background:#091426;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.pat{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--panel2);font-size:13px;line-height:1.65}
.pat a{color:var(--accent);text-decoration:none;font-family:var(--f-mono)}
.pat .t{font-weight:600}
.pat .m{color:var(--muted);font-size:12px}
.info{border:1px solid var(--accent);border-radius:6px;padding:9px 11px;background:#0d2440;font-size:13.5px;line-height:1.65}
.info .n{font-weight:700;color:#bfe8ff}
.partlist{display:flex;flex-wrap:wrap;gap:5px}
.partlist button{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:#12223d;cursor:pointer}
.partlist button.g{border-style:dashed}

#nav{grid-column:1/-1;grid-row:2;display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--line);background:#091424;padding:6px 8px;scrollbar-width:none}
#nav button{flex:0 0 auto;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:5px;background:transparent;cursor:pointer;color:var(--muted)}
#nav button b{font-family:var(--f-mono);margin-right:5px;color:var(--accent);font-weight:500}
#nav button.on{color:var(--fg);border-color:var(--accent);background:#0f2a45}

@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:44vh minmax(0,1fr) auto}
  #stage{grid-column:1;grid-row:1}
  #side{grid-column:1;grid-row:2;border-left:0;border-top:1px solid var(--line)}
  #nav{grid-row:3}
  .title h1{font-size:14px}.title div{display:none}
  .hud{top:auto;bottom:44px;right:8px}
  .hud .chip{font-size:10.5px}
  .tag{font-size:10.5px;padding:1px 4px}
  .views button{font-size:11px;padding:4px 6px}
}
</style>
<div id="app">
  <div id="stage">
    <canvas id="c" tabindex="0" aria-label="三维机床，可以拖动旋转、双指缩放、点零件看说明"></canvas>
    <div id="tags"></div>
    <div class="title"><h1>车钻铣三合一机床 · 电子挂轮</h1><div>参照 CT125E 的产品图和参数表，Blender 脚本建模；拖动旋转，点零件看说明</div></div>
    <div class="hud" id="hud"></div>
    <div class="views" id="views"></div>
    <div class="loading" id="loading"><div>正在加载三维模型…</div></div>
  </div>
  <div id="side"></div>
  <div id="nav"></div>
</div>
