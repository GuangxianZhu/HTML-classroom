<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万用表拆解</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout (same family as the motor / drone / hand viewers): full-bleed 3D stage; drawing title block + part card
   top-left, side panel (BOM / principle) right, mode tabs + controls in one strip at the bottom where the thumb is */
:root{
  --bg:#e4e8ec; --bg2:#f5f7f9; --panel:rgba(247,249,251,.93); --panel-solid:#f7f9fb;
  --fg:#161d26; --muted:#56616f; --line:#c2cad3; --accent:#a8521f; --accent-ink:#ffffff;
  --hl:#d6860b; --hl-ink:#1b1204; --shadow-a:.2;
  --c1:#c99400; --c2:#1f9447; --c3:#2a66cf; --c4:#d93b3b; --c5:#7b52c7; --off:#9aa4b0;
  --f-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ctrl-h:120px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1318; --bg2:#1a212a; --panel:rgba(20,25,32,.93); --panel-solid:#151a21;
  --fg:#e1e6ec; --muted:#98a3b0; --line:#2e3742; --accent:#e58c56; --accent-ink:#1a0d05;
  --hl:#f2b13d; --hl-ink:#1b1204; --shadow-a:.5;
  --c1:#f2c230; --c2:#46c477; --c3:#5b94ff; --c4:#ff5d5d; --c5:#a985f0; --off:#5b6573; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1318; --bg2:#1a212a; --panel:rgba(20,25,32,.93); --panel-solid:#151a21;
  --fg:#e1e6ec; --muted:#98a3b0; --line:#2e3742; --accent:#e58c56; --accent-ink:#1a0d05;
  --hl:#f2b13d; --hl-ink:#1b1204; --shadow-a:.5;
  --c1:#f2c230; --c2:#46c477; --c3:#5b94ff; --c4:#ff5d5d; --c5:#a985f0; --off:#5b6573; color-scheme:dark }

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-cn);-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,var(--bg2),var(--bg) 72%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#leaders,#tags{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .2s}
#leaders line{stroke:var(--fg);stroke-width:.9;opacity:.55}
#leaders circle{fill:var(--fg);opacity:.7}
#leaders line.sel{stroke:var(--hl);opacity:1;stroke-width:1.4}
#leaders circle.sel{fill:var(--hl);opacity:1}
.bln{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:1.25px solid var(--fg);background:var(--panel-solid);color:var(--fg);font:600 12.5px/1 var(--f-num);
  display:grid;place-items:center;padding:0;pointer-events:auto;cursor:pointer;font-variant-numeric:tabular-nums;will-change:transform}
.bln:hover{border-color:var(--accent);color:var(--accent)}
.bln.sel{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.tag{position:absolute;left:0;top:0;transform-origin:0 0;padding:2px 6px;border-radius:4px;white-space:nowrap;
  font:600 11.5px/16px var(--f-cn);color:#fff;background:var(--fg);will-change:transform;opacity:.95;translate:-50% -50%}
.bln:focus-visible,.btn:focus-visible,.row:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hud{position:absolute;z-index:2}
.left{top:12px;left:max(16px,env(safe-area-inset-left,0px));width:min(320px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}
.tb{border:1.25px solid var(--fg);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;grid-template-columns:1fr auto;font-size:12px}
.tb>div{padding:6px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.tb>div:nth-child(2n){border-right:0}
.tb>div:nth-last-child(-n+2){border-bottom:0}
.tb .name{grid-column:1/-1;border-right:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tb h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.tb .en{font:600 12px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tb .k{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em}
.tb .v{font:500 12px/1.35 var(--f-mono)}

.card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;font:600 15px/1 var(--f-num)}
.card h2{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.card .jp{font:500 11.5px var(--f-mono);color:var(--muted);margin-top:2px}
.card .x{margin-left:auto;flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:4px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.card dt{color:var(--muted)} .card dd{margin:0;font-family:var(--f-mono);font-size:12px;min-width:0}
.card p{margin:0;font-size:13px;line-height:1.6;max-width:60ch}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

.side{top:12px;right:max(16px,env(safe-area-inset-right,0px));width:380px;bottom:calc(var(--ctrl-h) + 10px);
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.side-head h3{margin:0;font-size:14px;font-weight:700}
.side-head h3 small{font:500 12px var(--f-mono);color:var(--muted);margin-left:6px}
.scroll{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;color:var(--fg);font:inherit}
.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row.sel{background:color-mix(in srgb,var(--hl) 18%,transparent)}
.row .n{grid-column:1;grid-row:1/3;width:22px;height:22px;border-radius:50%;border:1.25px solid var(--fg);display:grid;place-items:center;font:600 12px/1 var(--f-num)}
.row.sel .n{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.row .nm{grid-column:2;grid-row:1;font-size:13px;font-weight:500;min-width:0}
.row .q{grid-column:3;grid-row:1/3;font:500 12px var(--f-mono);color:var(--muted)}
.row .m{grid-column:2;grid-row:2;font:400 11px/1.3 var(--f-mono);color:var(--muted);min-width:0}

/* principle panel building blocks */
.pp{padding:12px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:baseline;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font:500 13px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.kv dd b{font:600 16px/1 var(--f-num);letter-spacing:.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12.5px/1 var(--f-cn);padding:6px 9px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:transparent;text-align:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.expl{font-size:13px;line-height:1.65;margin:0}
.expl b{font-weight:600}
.note{font-size:11.5px;line-height:1.55;color:var(--muted);margin:0}
table.st{width:100%;border-collapse:collapse;font:500 12px/1.25 var(--f-mono);font-variant-numeric:tabular-nums}
table.st th{font:500 11px var(--f-cn);color:var(--muted);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
table.st td{text-align:center;padding:5px 2px;border-bottom:1px solid var(--line)}
table.st td.l{text-align:left;font-family:var(--f-cn)}
table.st tr.cur td{background:color-mix(in srgb,var(--hl) 22%,transparent);font-weight:600}
.sub{font-size:12px;font-weight:700;margin:2px 0 -4px;color:var(--muted);letter-spacing:.06em}
canvas.plot{width:100%;height:140px;display:block}

.ctrl{left:0;right:0;bottom:0;padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:1080px;margin:0 auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;background:var(--panel-solid)}
.tab{font:500 13px/1 var(--f-cn);padding:7px 14px;border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{font:500 13px/1 var(--f-cn);padding:8px 11px;border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);border-radius:6px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn svg{width:13px;height:13px;fill:currentColor}
select.btn{padding:7px 8px}
.slider{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:170px}
.slider label{font-size:12px;color:var(--muted);white-space:nowrap}
.slider input{flex:1;min-width:0;accent-color:var(--accent)}
.slider output{font:500 12px var(--f-mono);min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cap{font-size:12.5px;line-height:1.55;color:var(--muted);min-width:0}
.cap b{color:var(--fg);font-weight:500}
.spacer{flex:1 1 0}

.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.loading div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 18px;font-size:13px;min-width:220px}
.loading .barl{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.loading .barl i{display:block;height:100%;width:0;background:var(--accent)}

@media (max-width:760px){
  .left{width:calc(100% - 32px)}
  .tb .hidemob{display:none}
  .tb{grid-template-columns:1fr 1fr}
  #info{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--ctrl-h) + 8px + env(safe-area-inset-bottom,0px));width:auto;max-height:40%;overflow:auto;z-index:3}
  .side{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;max-height:56%;bottom:calc(var(--ctrl-h) + 8px)}
  #pPanel{max-height:44%}
  #app.mode-principle .left{display:none}
  #app.mode-principle #cap{display:none}
  .pp{gap:8px;padding:10px 12px}
  .expl{font-size:12.5px;line-height:1.6}
  .slider{flex-basis:100%}
  .tab{padding:7px 12px}
  .mob-hide{display:none}
}
@media (prefers-reduced-motion: reduce){ #leaders,#tags{transition:none} }
.lcd{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;padding:10px 14px;border-radius:6px;background:#c9d4c2;color:#16201a;border:1px solid #9fae98;box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.lcd b{font:600 44px/1 var(--f-num);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.lcd small{font:600 15px/1 var(--f-num);letter-spacing:.06em}
.lcd .flag{margin-right:auto;font:600 12px/1 var(--f-num);letter-spacing:.08em;opacity:.75}
.tries{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tries .chip{padding:4px 7px;font:500 12px/1 var(--f-mono)}
.tries .chip.bad{text-decoration:line-through;opacity:.7}
.path{margin:0;padding-left:1.3em;font-size:12.5px;line-height:1.7}
.path li::marker{color:var(--muted);font:500 11px var(--f-mono)}
.warn{color:var(--c4);font-weight:600}
</style>

<div id="app">
  <canvas id="c" aria-label="数字万用表三维模型，可拖动旋转"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="tags"></div>
  <div class="loading" id="loading"><div><span id="ld-t">正在加载模型…</span><div class="barl"><i id="ld-b"></i></div></div></div>

  <div class="hud left">
    <div class="tb" role="group" aria-label="图纸标题栏">
      <div class="name"><h1>数字万用表</h1><span class="en">Auto-ranging DMM</span></div>
      <div><span class="k">计数</span><span class="v">6000 · 自动量程</span></div>
      <div><span class="k">外形（含护套）</span><span class="v">150 × 76 × 38 mm</span></div>
      <div class="hidemob"><span class="k">输入保护</span><span class="v">PTC + 压敏 · 4 A 保险丝</span></div>
      <div class="hidemob"><span class="k">电源</span><span class="v">2 × AAA · 3 V</span></div>
    </div>
    <div id="info" class="card" hidden aria-live="polite">
      <div class="card-head">
        <div class="card-no" id="i-no">1</div>
        <div><h2 id="i-cn">—</h2><div class="jp" id="i-en">—</div></div>
        <button class="x" id="i-close" aria-label="关闭说明">×</button>
      </div>
      <dl><dt>材料</dt><dd id="i-mat">—</dd><dt>数量</dt><dd id="i-qty">—</dd></dl>
      <p id="i-desc"></p>
    </div>
    <div class="hint" id="hint">拖动旋转，滚轮或双指缩放。点零件或编号看说明。</div>
  </div>

  <section class="hud side" id="bom" hidden aria-label="零件表">
    <div class="side-head"><h3>零件表<small id="bom-count"></small></h3><button class="btn" id="bom-close">收起</button></div>
    <div class="scroll" id="bom-list"></div>
  </section>

  <section class="hud side" id="pPanel" hidden aria-label="测量原理">
    <div class="side-head"><h3>测量原理<small id="pp-mode">电压</small></h3></div>
    <div class="scroll"><div class="pp">
      <div class="chips" role="group" aria-label="测量功能">
        <button class="chip" data-fn="V" aria-pressed="true">电压</button><button class="chip" data-fn="A" aria-pressed="false">电流</button>
        <button class="chip" data-fn="R" aria-pressed="false">电阻 / 通断</button><button class="chip" data-fn="N" aria-pressed="false">NCV 测电</button>
      </div>
      <div class="lcd" aria-live="polite"><span class="flag" id="lcd-flag">AUTO</span><b id="lcd-num">230.0</b><small id="lcd-unit">V</small></div>
      <div class="tries" id="tries"></div>
      <dl class="kv" id="kv"></dl>
      <p class="expl" id="expl"></p>
      <div class="sub">信号走的路（板子上发光的零件）</div>
      <ol class="path" id="path"></ol>
      <p class="note">面壳、护套、按键和屏幕支架已隐藏，液晶屏画成半透明。主板上发光的线是按信号走向画的示意，不是真实布线。</p>
    </div></div>
  </section>

  <div class="hud ctrl" id="ctrl">
    <div class="bar">
      <div class="bar-row">
        <div class="tabs" role="tablist" aria-label="模式">
          <button class="tab" role="tab" data-mode="struct" aria-selected="true">结构</button>
          <button class="tab" role="tab" data-mode="principle" aria-selected="false">原理</button>
          <button class="tab" role="tab" data-mode="model" aria-selected="false">模型</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="b-view">复位</button>
      </div>
      <div class="bar-row grp-struct">
        <button class="btn primary" id="b-play"><svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg><span id="b-play-t">装配</span></button>
        <div class="slider"><label for="r-ex">爆炸</label><input id="r-ex" type="range" min="0" max="100" value="100"><output id="o-ex">100%</output></div>
        <button class="btn" id="b-lbl" aria-pressed="true">编号</button>
        <button class="btn" id="b-bom" aria-pressed="false">零件表</button>
      </div>
      <div class="bar-row grp-principle" hidden>
        <div class="slider"><label for="r-in" id="l-in">被测电压</label><input id="r-in" type="range" min="0" max="1000" value="700"><output id="o-in">230 V</output></div>
        <button class="btn" id="b-x" aria-pressed="false">误碰 220 V</button>
      </div>
      <div class="bar-row grp-model" hidden>
        <button class="btn" id="b-cut" aria-pressed="false">剖切</button>

      </div>
      <div class="cap" id="cap"></div>
    </div>
  </div>
